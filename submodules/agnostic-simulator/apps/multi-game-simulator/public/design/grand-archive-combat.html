<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Archive · Combat design</title>
<style>
:root{color-scheme:dark;--bg:#10191e;--mat:#142326;--ink:#e9efeb;--quiet:#a6b7b7;--line:#354548;--legal:#8bd9bd;--gold:#e4c77b;--hurt:#f3a491;--card:76px}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:0;background:none;padding:8px 12px;border-radius:4px}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{cursor:default;opacity:.48}.review{height:78px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.review strong{display:block;font-size:13px}.review small{font-size:11px;color:var(--quiet)}select{max-width:165px;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:10px 0}.board{height:calc(100dvh - 122px);min-height:460px;position:relative;background:var(--mat);display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);overflow:hidden}.seat{min-height:0;min-width:0;position:relative;display:flex;align-items:center;padding:65px 14px 78px}.seat.enemy{justify-content:flex-end;border-bottom:1px solid var(--line);padding:68px 14px 50px}.field{display:flex;align-items:center;gap:18px;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:18px 5px;scrollbar-width:none}.enemy .field{flex-direction:row-reverse}.card{position:relative;flex:none;width:var(--card);padding:0;min-height:0;border-radius:3px;transition:transform .18s,box-shadow .18s;text-align:center;touch-action:pan-x;isolation:isolate}.card img{display:block;width:100%;height:auto;border-radius:3px}.card .name{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;margin-top:4px;color:var(--quiet)}.card.legal{box-shadow:0 0 0 1px var(--legal),0 0 14px #8bd9bd36}.card.chosen{box-shadow:0 0 0 2px var(--gold)}.card.rested{transform:rotate(45deg);margin-inline:calc(var(--card) * .3)}.mark{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:2px 6px;background:var(--mat);color:var(--gold);font-size:10px;white-space:nowrap}.damage{position:absolute;bottom:6px;right:4px;color:#221414;background:var(--hurt);font-size:12px;font-weight:700;padding:2px 5px;border-radius:3px}.hand{position:absolute;bottom:0;left:0;right:0;display:flex;overflow-x:auto;overflow-y:hidden;gap:8px;padding:10px 16px 0;justify-content:safe center;scroll-snap-type:x proximity;scrollbar-width:none}.memory{position:absolute;bottom:92px;left:14px;display:flex;gap:4px}.memory img{width:24px;height:auto;display:block}.hand .card{scroll-snap-align:center;width:64px}.hand .name{display:none}.card .name{max-width:105px;overflow:hidden;text-overflow:ellipsis}.enemy .hand{top:0;bottom:auto;padding:0 16px 10px}.enemy .hand .card{width:64px}.steps{flex-basis:100%;display:flex;gap:12px;margin:0;padding:0;list-style:none;font-size:11px;color:var(--quiet)}.steps li{flex:1;white-space:nowrap;padding-bottom:4px;border-bottom:1px solid var(--line)}.steps li[aria-current="step"]{color:var(--gold);border-color:var(--gold);font-weight:650}.steps li.past{color:var(--ink)}.window{display:block;font-size:11px;color:var(--quiet);margin-bottom:3px}.window.open{color:var(--gold)}.divider{flex-wrap:wrap;position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--mat);min-height:64px}.prompt{flex:1;min-width:0}.prompt strong{display:block;font-size:14px;font-weight:600}.prompt small{display:block;color:var(--quiet);font-size:11px;margin-top:2px}.primary{background:var(--gold);color:#221f17;font-weight:650;white-space:nowrap}.quiet{color:var(--quiet);padding:8px}.detail{position:absolute;bottom:112px;right:14px;font-size:11px;color:var(--quiet);padding:8px 0;max-width:55%;text-align:right}.intent{position:absolute;bottom:100%;left:14px;font-size:11px;padding:6px 0;color:var(--gold)}.intent button{padding:0;min-height:44px}.trace{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.trace line{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 5;opacity:.75}.order{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:#171b18;background:#e4c77bce}.dock{height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--quiet)}.dock button{min-height:44px;padding:4px 0;color:var(--quiet);font-size:11px}.inspect{position:absolute;z-index:8;inset:auto 16px 16px;background:var(--bg);padding:16px;box-shadow:0 6px 30px #0006}.inspect h3{font-size:14px;margin:0 0 4px}.inspect p{color:var(--quiet);margin:0 0 12px}.inspect .close{float:right}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:720px){:root{--card:98px}.review{height:66px;padding:10px 28px}.board{height:calc(100dvh - 110px);min-height:520px;margin:0 24px}.seat{padding:85px 30px 120px}.seat.enemy{padding:110px 30px 60px}.field{gap:26px}.hand .card,.enemy .hand .card{width:90px}.hand{padding-top:34px;overflow-y:clip}.hand .card{transform:translateY(26px)}.enemy .hand .card{transform:translateY(-26px)}.hand .card:hover,.hand .card:focus-visible{transform:translateY(0)}.divider{padding:8px 30px;background:transparent}.prompt{background:var(--mat);flex:0 1 auto;padding-right:12px}.divider .quiet{margin-left:auto;background:var(--mat)}.divider>.primary{margin-left:auto}.divider>.quiet:not([hidden])+.primary{margin-left:0}.detail{right:30px;bottom:152px}.dock{padding:0 28px}.inspect{max-width:360px;left:auto}.card:hover{z-index:2}.prompt strong{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="review"><div><strong>Grand Archive · combat</strong><small>Interactive design · illustrative cards and values</small></div><label><span class="sr">Review scenario</span><select id="scenario"><option value="ally">Ally attack</option><option value="weapon">Champion + weapon</option><option value="attack">Attack card + cost</option><option value="multi">Multiple defenders</option><option value="replacement">Damage replacements</option></select></label></header>
<main class="board" aria-label="Combat board"><section class="seat enemy" aria-label="Opponent seat"><div class="hand" id="enemyHand"></div><div class="field" id="enemyField"></div></section><section class="seat" aria-label="Your seat"><div class="field" id="yourField"></div><div class="hand" id="yourHand"></div><div class="memory" id="memory" aria-label="Memory"></div><div class="detail" id="detail"></div></section><svg class="trace" aria-hidden="true"><line id="line"/></svg><div class="divider"><ol class="steps" id="steps" aria-label="Combat progress"></ol><div class="prompt" role="status" aria-live="polite"><span class="window" id="window"></span><strong id="title"></strong><small id="hint"></small></div><button id="back" class="quiet" aria-label="Cancel attack draft">↶</button><button id="action" class="primary"></button><span class="intent" id="intent"></span></div><aside id="inspection" class="inspect" hidden></aside></main>
<footer class="dock"><span id="perspective">You · Main phase</span><button id="remote" hidden>Simulate opponent pass</button><button id="restart">Restart example</button></footer>
<script>
const CDN='https://cdn.tcg.online/public/grand-archive/';
const art={champ:CDN+'assets/full/ab4e8e1ac1ee239109f260f9b6a41855100a829d1990cf76411341bd32668056.webp',ally:CDN+'assets/board/4ac56c50f5a7720dc14e231112237965b11ce3d79aae7b44c81a51c5c696a7c8.webp',hand:CDN+'assets/full/a5cd87941083d95b739ac0ba9eb00f67b61cf81f6df55aa7f857e51c5ee6a901.webp',back:CDN+'simulator/card-back.webp'};
const $=id=>document.getElementById(id);let mode='ally',step='main',restedUnit='',attacker='',target='',weapon=false,paid=[],ordered=[],retaliators=[],currentDefender=0,version=0,history=[],windowActor='you';
const prompts={main:['Choose an attacker','Tap a glowing card to attack.'],weapon:['Choose a weapon','Tap the weapon, or attack without it.'],target:['Choose a target','Tap a glowing opponent card.'],payment:['Reserve 2 cards','Tap cards in your hand to pay the cost.'],activation:['Attack card on the stack','Both players may respond before it resolves.'],onattack:['Resolve On Attack','Respond to the pending attack trigger, or pass.'],retaliationEnd:['After retaliation','Resolve any remaining effects, then pass.'],before:['Before retaliation','Play a fast response, or pass opportunity.'],retaliation:['Retaliate?','Only the defending unit may retaliate.'],damage:['Before damage','Last response window before damage is dealt.'],order:['Order retaliation','Tap the defenders in the order you choose.'],replacement:['Choose the first replacement','Tap the effect to apply first.'],resolve:['Dealing damage','Damage is simultaneous. No response window.'],cleanup:['Finishing combat','Combat ended · resolving remaining effects.'],done:['Main phase','Combat complete. Choose your next action.']};
function state(){return {step,attacker,target,weapon,paid:[...paid],ordered:[...ordered],retaliators:[...retaliators],currentDefender};}
function go(next){history.push(state());if(next==='activation'||next==='before')restedUnit=attacker;step=next;windowActor='you';version++;render();}
function reset(){version++;step='main';restedUnit='';attacker='';target='';weapon=false;paid=[];ordered=[];retaliators=[];currentDefender=0;history=[];windowActor='you';render();}
function card(id,name,type,eligible=false,selected=false,extra=''){return `<button class="card ${eligible?'legal':''} ${selected&&!['cleanup','done'].includes(step)?'chosen':''} ${restedUnit===id||retaliators.includes(id)?'rested':''}" data-card="${id}" aria-label="${name}${eligible?', selectable':''}" ${eligible?'':'aria-disabled="true" tabindex="-1"'} draggable="${eligible&&id.startsWith('h')}"><img src="${art[type]}" alt="" draggable="false">${name==='Your ally'?'':`<span class="name">${name}</span>`}${extra}</button>`;}
function render(){
const active=document.activeElement,focusCard=active.dataset.card,hadFocus=document.querySelector('.board').contains(active);
const selecting=step==='target',multi=mode==='multi';
const open=['activation','onattack','before','retaliationEnd','damage','cleanup'].includes(step);
const phase=['weapon','target'].includes(step)?0:['onattack','before','retaliation','retaliationEnd'].includes(step)?1:['damage','order','replacement','resolve'].includes(step)?2:step==='cleanup'?3:-1;
$('steps').hidden=phase<0;$('steps').innerHTML=['1 Declare','2 Retaliation','3 Damage','4 End'].map((label,i)=>`<li ${i===phase?'aria-current="step"':''} class="${i<phase?'past':''}">${label}</li>`).join('');
$('window').className='window'+(open?' open':'');$('window').textContent=open?'Opportunity · '+(windowActor==='you'?'You may act':'Opponent may act'):step==='resolve'?'No opportunity · resolving damage':step==='retaliation'?'Defender decision · no response window':step==='order'?'Attacker orders · no response window':step==='replacement'?'Affected controller chooses · no response window':['weapon','target'].includes(step)?'Declaration · no response window':step==='payment'?'Main phase · pay activation cost':step==='main'?'Main phase · attack available':'Main phase · combat complete';
$('remote').hidden=!(open&&windowActor==='opponent');$('restart').hidden=open&&windowActor==='opponent';
$('enemyHand').innerHTML=Array.from({length:5},(_,i)=>card('hidden'+i,'Opponent hand card '+(i+1),'back')).join('');
$('enemyField').innerHTML=card('ec','Opponent champion','champ',selecting&&!multi,target==='ec',step==='resolve'&&target==='ec'?'<span class="damage">−1</span>':'')+['e1',...(multi?['e2']:[])].map((id,i)=>card(id,'Defending ally '+(i+1),'ally',selecting||step==='order',target===id||target==='all', step==='order'&&ordered.includes(id)?`<span class="order">${ordered.indexOf(id)+1}</span>`: step==='retaliation'&&id===(multi?['e1','e2'][currentDefender]:target)?'<span class="mark">Retaliate?</span>':step==='resolve'&&(target===id||target==='all')?'<span class="damage">−1</span>':'')).join('');
$('yourField').innerHTML=card('yc','Your champion','champ',step==='main'&&mode!=='ally'&&mode!=='attack',attacker==='yc',step==='resolve'&&attacker==='yc'&&retaliators.length?`<span class="damage">−${retaliators.length}</span>`:'')+card('y1','Your ally','ally',step==='main'&&mode==='ally',attacker==='y1',step==='resolve'&&attacker==='y1'&&retaliators.length?`<span class="damage">−${retaliators.length}</span>`:'')+(mode==='weapon'?card('w','Weapon','back',step==='weapon',weapon):'');
$('yourHand').innerHTML=Array.from({length:6},(_,i)=>i).filter(i=>mode!=='attack'||['main','payment'].includes(step)||i!==0&&!paid.includes(i)).map(i=>card('h'+i,step==='payment'?'Reserve card '+(i+1):i===0&&mode==='attack'?'Attack card':'Hand card '+(i+1),'hand',step==='payment'&&i!==0||step==='main'&&mode==='attack'&&i===0,paid.includes(i),paid.includes(i)?'<span class="mark">Reserved</span>':'')).join('');
$('memory').innerHTML=mode==='attack'&&!['main','payment'].includes(step)?paid.map(()=>`<img src="${art.back}" alt="Reserved memory card">`).join(''):'';
let [title,hint]=prompts[step];if(step==='payment')hint=`${paid.length} of 2 selected · final selection pays automatically`;if(step==='retaliation'&&multi)hint=`Defending ally ${currentDefender+1} of 2 · rest to retaliate`;if(step==='target'&&multi)hint='Choose the opposing player for this Cleave example.';
if(open&&windowActor==='opponent')hint='Waiting for the opponent’s response.';
$('title').textContent=title;$('hint').textContent=hint;
const labels={main:'',weapon:'No weapon',target:multi?'Attack opponent':'',payment:'',activation:'Pass opportunity',onattack:'Pass opportunity',retaliationEnd:'Pass opportunity',before:'Pass opportunity',retaliation:'Retaliate',damage:'Pass opportunity',order:'',replacement:'',resolve:'',cleanup:'Pass opportunity',done:'Attack again'};
$('action').disabled=open&&windowActor==='opponent';$('action').textContent=labels[step];$('action').hidden=!labels[step];$('back').hidden=!['weapon','target','payment','retaliation','before','damage'].includes(step)||mode==='attack'&&step==='target';$('back').textContent=step==='retaliation'?'Take hit':['before','damage'].includes(step)?'Effects':'↶';$('back').setAttribute('aria-label',step==='retaliation'?'Take hit':['before','damage'].includes(step)?'Inspect effects':'Cancel attack draft');
$('perspective').textContent=(step==='retaliation'?'Opponent decision · preview':'Your view')+' · '+(phase<0?'Main phase':'Combat');
$('detail').textContent=['before','retaliation','damage'].includes(step)?(retaliators.length?'Preview · 1 attack / '+retaliators.length+' retaliation':'Preview · 1 attack / 0 retaliation')+' · may change':'';
$('intent').innerHTML=step==='onattack'?'<button id="intentInspect">Intent ↗</button> · <button id="onAttackInspect">Stack · On Attack trigger ↗</button>':mode==='attack'&&!['main','weapon','payment','cleanup','done'].includes(step)?`<button id="intentInspect">${step==='activation'?'Stack':'Intent'} · attack card ↗</button>`:step==='cleanup'?'<button id="cleanupInspect">Stack · damage trigger ↗</button>':step==='replacement'?'<button id="r1">Apply prevention first</button> · <button id="r2">Apply reduction first</button>':'';
if($('intentInspect'))$('intentInspect').onclick=()=>inspect('Public Intent','This resolved attack card contributes to the attack and remains visible until end-of-combat cleanup.');
if($('onAttackInspect'))$('onAttackInspect').onclick=()=>inspect('On Attack trigger','Illustrative trigger. Players receive Opportunity to respond before this resolves, then receive the separate before-retaliation window.');
if($('cleanupInspect'))$('cleanupInspect').onclick=()=>inspect('Damage trigger','Illustrative pending trigger. Passes resolve this remaining effect before returning to Main.');
if($('r1'))$('r1').onclick=$('r2').onclick=()=>resolve();
requestAnimationFrame(()=>{draw();if(hadFocus){const same=focusCard&&document.querySelector(`[data-card="${focusCard}"].legal`);const next=same||(!$('action').hidden?$('action'):document.querySelector('.card.legal'));if(next)next.focus({preventScroll:true});}});
if(step==='resolve'){const token=version;setTimeout(()=>{if(version===token)go('cleanup');},1800);}
}
function draw(){const a=document.querySelector(`[data-card="${attacker}"]`),svg=document.querySelector('.trace'),board=document.querySelector('.board').getBoundingClientRect();svg.innerHTML='';if(!a||!['onattack','before','retaliation','retaliationEnd','damage','order','replacement','resolve'].includes(step))return;const x=a.getBoundingClientRect();const targets=target==='all'?['e1','e2']:[target];svg.innerHTML=targets.map(id=>{const b=document.querySelector(`[data-card="${id}"]`);if(!b)return '';const y=b.getBoundingClientRect();return `<line x1="${x.x+x.width/2-board.x}" y1="${x.y-board.y}" x2="${y.x+y.width/2-board.x}" y2="${y.bottom-board.y}"/>`;}).join('');}
function choose(id){if(step==='main'&&(id==='y1'&&mode==='ally'||id==='yc'&&mode!=='ally'||id==='h0'&&mode==='attack')){attacker=mode==='ally'?'y1':'yc';go(mode==='weapon'?'weapon':mode==='attack'?'payment':'target');}else if(step==='weapon'&&id==='w'){weapon=true;go('target');}else if(step==='target'&&id.startsWith('e')){target=mode==='multi'?'all':id;go(mode==='attack'?'onattack':'before');}else if(step==='payment'&&id.startsWith('h')&&!id.startsWith('hidden')){const i=Number(id.slice(1));if(i===0)return;paid=paid.includes(i)?paid.filter(x=>x!==i):[...paid,i];if(paid.length===2)go('activation');else render();}else if(step==='order'&&retaliators.includes(id)){ordered=ordered.includes(id)?ordered.filter(x=>x!==id):[...ordered,id];if(ordered.length===retaliators.length)afterOrder();else render();}}
function decide(retaliate){if(retaliate)retaliators.push(mode==='multi'?['e1','e2'][currentDefender]:target);currentDefender++;if(mode==='multi'&&currentDefender<2)render();else go('retaliationEnd');}
function afterOrder(){if(mode==='replacement')go('replacement');else resolve();}
function resolve(){go('resolve');}
document.querySelector('.board').addEventListener('click',e=>{const c=e.target.closest('[data-card]');if(c)choose(c.dataset.card);});
function advanceWindow(){if(windowActor==='you'){windowActor='opponent';render();return;}if(step==='activation')go('target');else if(step==='onattack')go('before');else if(step==='before')go('retaliation');else if(step==='retaliationEnd')go('damage');else if(step==='damage'){if(retaliators.length>1)go('order');else afterOrder();}else if(step==='cleanup'){attacker='';target='';go('done');}}
$('remote').onclick=advanceWindow;
$('action').onclick=()=>{if(['activation','onattack','before','retaliationEnd','damage','cleanup'].includes(step))advanceWindow();else if(step==='weapon')go('target');else if(step==='target'){target='all';go('before');}else if(step==='retaliation')decide(true);else reset();};
$('back').onclick=()=>{if(step==='retaliation')decide(false);else if(['before','damage'].includes(step))inspect('Effects stack','Empty in this example. In live play, show occupied effects in engine order; fast responses are selected directly from cards.');else reset();};
function inspect(title,text){$('inspection').hidden=false;$('inspection').innerHTML=`<button class="close" aria-label="Close inspection">×</button><h3>${title}</h3><p>${text}</p>`;$('inspection').querySelector('button').onclick=()=>{$('inspection').hidden=true;};}
$('scenario').onchange=e=>{mode=e.target.value;$('inspection').hidden=true;reset();};$('restart').onclick=reset;
document.querySelector('.board').addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(c)e.dataTransfer.setData('text/plain',c.dataset.card);});document.querySelector('.board').addEventListener('dragover',e=>e.preventDefault());document.querySelector('.board').addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(step==='main'&&id==='h0'&&mode==='attack')choose(id);});
window.addEventListener('resize',draw);reset();
</script></html>
