<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Weapon attachment: six design states</title><desc id="desc">Schematic proposal showing source, legal hosts, payment review, pending state, accepted movement and persistent host relation. Not native evidence.</desc><rect width="1200" height="800" fill="#0d1821"/><style>text{font-family:system-ui;fill:#eef4f7} .small{font-size:14px} .label{font-size:18px;font-weight:600}</style><text x="24" y="34" font-size="24">Attachment — design specification</text><text x="24" y="60" class="small">Schematic only · native legality and payment remain authoritative · cards are symbolic</text><g transform="translate(24,90)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">1. Available</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="48" y="226" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="53" y="256" class="small">Weapon</text><text x="16" y="311" font-size="11">Weapon in Accessories; host relation absent.</text></g><g transform="translate(418,90)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">2. Hover / focus</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="48" y="226" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="53" y="256" class="small">Weapon</text><text x="16" y="311" font-size="11">Outline source; expose Attach and native</text><text x="16" y="327" font-size="11">cost.</text></g><g transform="translate(812,90)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">3. Selected</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="48" y="226" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="53" y="256" class="small">Weapon</text><path d="M 80 226 L 130 170" stroke="#ffe0a3" stroke-width="3" stroke-dasharray="6 5"/><rect x="104" y="128" width="62" height="72" fill="none" stroke="#ffe0a3" stroke-dasharray="4 4"/><text x="185" y="244" class="small">Native cost</text><text x="185" y="266" class="small">Confirm / Cancel</text><text x="16" y="311" font-size="11">Bracket legal hosts; preview chosen host</text><text x="16" y="327" font-size="11">edge.</text></g><g transform="translate(24,434)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">4. Pending</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="48" y="226" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="53" y="256" class="small">Weapon</text><path d="M 80 226 L 130 170" stroke="#ffe0a3" stroke-width="3" stroke-dasharray="6 5"/><rect x="104" y="128" width="62" height="72" fill="none" stroke="#ffe0a3" stroke-dasharray="4 4"/><text x="185" y="245" class="small">Await result</text><text x="16" y="311" font-size="11">Retain old position; no optimistic</text><text x="16" y="327" font-size="11">attachment.</text></g><g transform="translate(418,434)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">5. Resolving</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="48" y="226" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="53" y="256" class="small">Weapon</text><path d="M 80 226 L 130 170" stroke="#ffe0a3" stroke-width="3" stroke-dasharray="6 5"/><rect x="104" y="128" width="62" height="72" fill="none" stroke="#ffe0a3" stroke-dasharray="4 4"/><text x="185" y="245" class="small">Payment + move</text><text x="16" y="311" font-size="11">Accepted result: 260 ms transfer + 100 ms</text><text x="16" y="327" font-size="11">settle.</text></g><g transform="translate(812,434)"><rect width="370" height="338" rx="12" fill="#172833" stroke="#415662"/><text x="16" y="30" class="label">6. Completed</text><text x="16" y="59" class="small">Clash zone</text><rect x="40" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#dce8ec"/><text x="49" y="110" class="small">Host A</text><rect x="225" y="78" width="86" height="120" rx="5" fill="#304555" stroke="#83939b"/><text x="234" y="110" class="small">Host B</text><rect x="103" y="127" width="62" height="72" rx="4" fill="#60533a" stroke="#ffe0a3"/><text x="108" y="157" class="small">Weapon</text><path d="M 83 198 L 134 199" stroke="#ffe0a3" stroke-width="3"/><text x="175" y="240" class="small">Attached to Host A</text><text x="16" y="311" font-size="11">Persistent host link; inspect both cards</text><text x="16" y="327" font-size="11">separately.</text></g><text x="24" y="792" class="small">Reduced motion: immediate placement + 80 ms fade. No animation may create an attachment.</text></svg>