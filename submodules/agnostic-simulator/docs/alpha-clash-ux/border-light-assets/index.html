<!doctype html><html lang="en"><meta charset="utf-8"><title>Alpha Clash · Border light study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080f15;color:#d6e4e8;font:15px system-ui}header{padding:20px 28px;display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0 0 7px}p{margin:0;color:#9badb8;font-size:13px}button{background:#182a35;color:#e8f1f4;border:1px solid #4d6674;border-radius:6px;padding:11px 16px;cursor:pointer}button[aria-pressed=true]{background:#294652;border-color:#9ed5df}.board{position:relative;max-width:min(1200px,calc((100vh - 160px)*1.5));margin:0 auto}.board img{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;pointer-events:none}footer{max-width:1200px;margin:16px auto;padding:0 15px;font-size:13px;color:#9badb8}</style>
<header><div><h1>Border light study · Turn ownership</h1><p>Narrow light channels. No broad bloom. Board-only asset preview.</p></div><nav><button id="you" aria-pressed="true">Your turn</button> <button id="them" aria-pressed="false">Opponent’s turn</button></nav></header>
<div class="board"><img src="../../../apps/multi-game-simulator/src/games/alpha-clash/components/Arena3D/assets/table.webp" alt="Original Alpha Clash table"><img id="upper" class="overlay" src="opponent-dim.svg" alt="Opponent border dimmed"><img id="lower" class="overlay" src="player-lit.svg" alt="Player border lit"></div>
<footer>Asset alignment study. The original table has baked light spill; the overlays attenuate the traced channels, not every bright pixel. Hands, shadows, and priority controls are outside this study.</footer>
<script>function setTurn(own){document.querySelector('#upper').src='opponent-'+(own?'dim':'lit')+'.svg';document.querySelector('#lower').src='player-'+(own?'lit':'dim')+'.svg';document.querySelector('#upper').alt='Opponent border '+(own?'dimmed':'lit');document.querySelector('#lower').alt='Player border '+(own?'lit':'dimmed');document.querySelector('#you').setAttribute('aria-pressed',own);document.querySelector('#them').setAttribute('aria-pressed',!own)}document.querySelector('#you').onclick=()=>setTurn(true);document.querySelector('#them').onclick=()=>setTurn(false);</script></html>
