packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@typescript/native": "npm:typescript@7.0.2"
  "@typescript/native-preview": "npm:typescript@7.0.2"
  "@types/node": ^24
  bun-types: ^1.3.13
  typescript: "npm:@typescript/typescript6@6.0.2"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.4"
  vite-plus: 0.2.4
  vitest: "npm:@voidzero-dev/vite-plus-test@0.1.24"
  zod: ^4.4.3

catalogMode: prefer
overrides:
  "@voidzero-dev/vite-plus-core": 0.2.4
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

patchedDependencies:
  '@voidzero-dev/vite-plus-test': patches/@voidzero-dev__vite-plus-test.patch
