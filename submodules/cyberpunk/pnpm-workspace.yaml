packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@typescript/native": "npm:typescript@7.0.2"
  "@typescript/native-preview": "npm:typescript@7.0.2"
  "@discord/embedded-app-sdk": ^2.5.0
  "@dnd-kit/core": ^6.3.1
  "@mantine/dropzone": ^9.0.0
  "@mantine/modals": ^9.0.0
  "@mantine/notifications": ^9.0.0
  "@mantine/spotlight": ^9.0.0
  "@playwright/test": ^1.59.1
  "@tabler/icons-react": ^3.41.1
  "@types/node": ^24
  better-auth: 1.6.9
  bun-types: ^1.3.13
  cheerio: ^1.2.0
  mutative: ^1.3.0
  socket.io-client: ^4.8.3
  socket.io-msgpack-parser: ^3.0.2
  typescript: "npm:@typescript/typescript6@6.0.2"
  vite: "npm:@voidzero-dev/vite-plus-core@0.2.4"
  vite-plus: 0.2.4
  vitest: "npm:@voidzero-dev/vite-plus-test@0.1.24"
  zod: ^4.4.3

catalogMode: prefer
onlyBuiltDependencies:
  - esbuild
overrides:
  "@voidzero-dev/vite-plus-core": 0.2.4
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

patchedDependencies:
  '@voidzero-dev/vite-plus-test': patches/@voidzero-dev__vite-plus-test.patch
